<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic HTML Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 40px auto;
      max-width: 800px;
      padding: 0 20px;
      color: #333;
    }
    header {
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <nav>
      <a href="#about">About</a> | 
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About This Page</h2>
      <p>This is a simple HTML5 template. It includes common semantic elements like a header, main content, and footer.</p>
    </section>

    <section id="interactive">
      <h2>Interactive Demo</h2>
      <p>Click the button below to see basic JavaScript in action:</p>
      <button onclick="showAlert()">Click Me</button>
    </section>
  </main>

  <footer style="margin-top: 40px; font-size: 14px; color: #777;">
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

  <script>
    function showAlert() {
      alert("Hello! JavaScript is working.");
    }
  </script>

</body>
</html>
